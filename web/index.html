<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sketch</title>
<link rel="stylesheet" href="/dist/app.css">
<style>
html,body,#root{height:100%;margin:0;overflow:hidden;touch-action:none;overscroll-behavior:none}
.board{position:fixed;inset:0}
/* Keep Excalidraw's core toolbar and zoom; hide the extras (library, menu, help, hints, welcome) */
.default-sidebar-trigger,.main-menu-trigger,.help-icon,.HintViewer,.welcome-screen-center{display:none!important}
/* Excalidraw's own undo and redo move to the top right, together */
.undo-redo-buttons{position:fixed!important;top:calc(16px + env(safe-area-inset-top,0px));right:16px;left:auto!important;bottom:auto!important;z-index:10;display:flex;gap:6px}
.undo-button-container,.redo-button-container{position:static!important}
/* Engineering sidebar on the left */
.eng-side{position:absolute;left:16px;top:72px;z-index:10;width:188px;display:flex;flex-direction:column;gap:4px;padding:10px;max-height:calc(100% - 96px);overflow-y:auto;scrollbar-width:none;background:#fff;border:1px solid #e3e7eb;border-radius:14px;box-shadow:0 8px 24px #1f2a3614}
.eng-side::-webkit-scrollbar{display:none}
.eng-side section + section{margin-top:8px}
.eng-side h3{margin:0 0 4px 8px;font:600 11px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#8a96a3}
.eng-side button{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:9px;background:transparent;color:#1F2A36;font:500 14px -apple-system,BlinkMacSystemFont,sans-serif;text-align:left;cursor:pointer;transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 160ms ease}
.eng-side button:active{transform:scale(.97)}
.eng-side button.on{background:#EAF0FF}
.eng-side .ico{display:inline-flex;width:20px;height:20px;flex:none;color:#2563EB}
.eng-side .ico svg{width:20px;height:20px}
@media (hover:hover) and (pointer:fine){.eng-side button:hover{background:#f0f3f6}.eng-side button.on:hover{background:#dfe8ff}}
@media (prefers-reduced-motion:reduce){.eng-side button{transition:none}}
/* Status toast: shows what an engineering tool did, or why it could not run */
.eng-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:10px;max-width:min(440px,calc(100vw - 32px));padding:11px 16px;border-radius:12px;background:#1F2A36;color:#fff;font:500 14px -apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 10px 30px #1f2a3640;pointer-events:none;animation:eng-toast-in 220ms cubic-bezier(.23,1,.32,1) both}
.eng-toast::before{content:"";width:8px;height:8px;border-radius:50%;background:#4ade80;flex:none}
.eng-toast.warn::before{background:#f59e0b}
@keyframes eng-toast-in{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){.eng-toast{animation:none}}
/* Depth dialog for Mark profile */
.eng-dialog-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(31,42,54,.17);padding:24px}
.eng-dialog{width:min(340px,100%);display:flex;flex-direction:column;gap:14px;padding:20px;background:#fff;border:1px solid #e8ebee;border-radius:14px;box-shadow:0 18px 60px #1f2a362b;font:14px -apple-system,BlinkMacSystemFont,sans-serif;color:#1F2A36;animation:eng-toast-in 200ms cubic-bezier(.23,1,.32,1) both}
.eng-dialog h2{margin:0;font:600 17px -apple-system,BlinkMacSystemFont,sans-serif}
.eng-dialog label{display:flex;flex-direction:column;gap:6px;font-weight:500;color:#3B4650}
.eng-dialog input{height:44px;padding:0 12px;border:1px solid #cfd6df;border-radius:9px;font:16px -apple-system,BlinkMacSystemFont,sans-serif}
.eng-dialog-actions{display:flex;justify-content:flex-end;gap:8px}
.eng-dialog-actions button{min-height:44px;padding:0 18px;border-radius:9px;border:1px solid #dce1e7;background:#fff;color:#3B4650;font:600 14px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer;transition:transform 160ms cubic-bezier(.23,1,.32,1)}
.eng-dialog-actions button:active{transform:scale(.97)}
.eng-dialog-actions .primary{background:#2563EB;border-color:#2563EB;color:#fff}
@media (prefers-reduced-motion:reduce){.eng-dialog{animation:none}}
/* Top bar: keep the drawing tools; hide image, the More tools menu and the tool lock */
[title^="Insert image"],[title^="Keep selected tool"],.App-toolbar__extra-tools-trigger,.dropdown-menu-button{display:none!important}
</style>
</head>
<body>
<div id="root"></div>
<script>
// iPad Safari zooms the whole page on pinch unless told not to. The board handles pinch itself.
["gesturestart", "gesturechange", "gestureend"].forEach(function (type) {
  document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
});
</script>

<script>window.EXCALIDRAW_ASSET_PATH = "/dist/";</script>
<script src="/dist/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Bevel</title>
<link rel="stylesheet" href="/dist/app.css">
<style>
html,body,#root{height:100%;margin:0;overflow:hidden;touch-action:none;overscroll-behavior:none}
.board{position:fixed;inset:0}
/* Keep Excalidraw's core toolbar and zoom; hide the extras (library, menu, help, hints, welcome) */
.default-sidebar-trigger,.main-menu-trigger,.help-icon,.HintViewer,.welcome-screen-center{display:none!important}
/* Excalidraw's own undo and redo move to the top right, together */
.undo-redo-buttons{position:fixed!important;top:calc(16px + env(safe-area-inset-top,0px));right:16px;left:auto!important;bottom:auto!important;z-index:10;display:flex;gap:6px}
.undo-button-container,.redo-button-container{position:static!important}
/* Engineering sidebar on the left */
.eng-side{position:absolute;left:16px;top:72px;z-index:10;width:188px;display:flex;flex-direction:column;gap:4px;padding:10px;max-height:calc(100% - 140px);overflow-y:auto;scrollbar-width:none;background:#fff;border:1px solid #e3e7eb;border-radius:14px;box-shadow:0 8px 24px #1f2a3614}
.eng-side::-webkit-scrollbar{display:none}
.eng-side section + section{margin-top:8px}
.eng-side h3{margin:0 0 4px 8px;font:600 11px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#8a96a3}
.eng-side button{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:0;border-radius:9px;background:transparent;color:#1F2A36;font:500 14px -apple-system,BlinkMacSystemFont,sans-serif;text-align:left;cursor:pointer;transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 160ms ease}
.eng-side button:active{transform:scale(.97)}
.eng-side button.on{background:#EAF0FF}
.eng-side .ico{display:inline-flex;width:20px;height:20px;flex:none;color:#2563EB}
.eng-side .ico svg{width:20px;height:20px}
@media (hover:hover) and (pointer:fine){.eng-side button:hover{background:#f0f3f6}.eng-side button.on:hover{background:#dfe8ff}}
@media (prefers-reduced-motion:reduce){.eng-side button{transition:none}}
/* Sheet settings: a small pair of toggles under the tools */
.eng-sheet{display:flex;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid #edf0f3}
.eng-sheet button{flex:1;flex-direction:column;justify-content:center;gap:2px;min-height:48px;padding:4px 2px;font-size:11px;color:#5b6772;white-space:nowrap}
/* Bridge: whether the laptop has the latest drawing and which build the AI has */
.eng-send{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.eng-status{display:flex;align-items:center;gap:8px;min-height:28px;padding:0 8px}
.eng-link{display:flex;align-items:center;gap:7px;flex:1;min-width:0;margin:0;font:500 12px -apple-system,BlinkMacSystemFont,sans-serif;color:#5b6772}
.eng-link span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.eng-mass{flex:none;font:600 12px -apple-system,BlinkMacSystemFont,sans-serif;font-variant-numeric:tabular-nums;color:#1F2A36}
/* Shop checks fold into one quiet row; tapping it opens the list (or shows the shape, for one check) */
.eng-side .eng-checkrow{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 10px;border-radius:9px;background:#F3F6FA;color:#3B4650;font:500 13px -apple-system,BlinkMacSystemFont,sans-serif;animation:eng-rise 200ms cubic-bezier(.23,1,.32,1)}
.eng-side .eng-checkrow::before{content:"";width:6px;height:6px;border-radius:50%;background:#2563EB;flex:none}
.eng-side .eng-checkrow.warn{background:#FFF6EB;color:#7A4A06}
.eng-side .eng-checkrow.warn::before{background:#d97706}
.eng-checkrow .chev{margin-left:auto;font-size:16px;line-height:1;color:currentColor;opacity:.5}
@media (hover:hover) and (pointer:fine){.eng-side .eng-checkrow:hover{background:#EBF0F6}.eng-side .eng-checkrow.warn:hover{background:#FDEEDC}}
@keyframes eng-rise{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion:reduce){.eng-side .eng-checkrow{animation:none}}
.eng-link::before{content:"";width:6px;height:6px;border-radius:50%;background:#9aa5b1;flex:none;transition:background-color 200ms ease}
.eng-link.live::before{background:#16a34a}
.eng-link.syncing::before{background:#2563EB}
.eng-link.offline{color:#7A4A06}.eng-link.offline::before{background:#d97706}
.eng-link.error{color:#b42318}.eng-link.error::before{background:#b42318}
/* The laptop's verdict on the part: weight, and the checks a shop would make. Tapping a check shows its shape. */
.eng-made{margin:2px 0 0 8px;font:500 12px -apple-system,BlinkMacSystemFont,sans-serif;color:#3B4650}
.eng-checks{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.eng-checks button{display:block;width:100%;min-height:0;padding:6px 8px 6px 20px;border:0;border-radius:8px;background:transparent;text-align:left;font:500 12px/1.3 -apple-system,BlinkMacSystemFont,sans-serif;color:#3B4650;position:relative;cursor:pointer}
.eng-checks span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.eng-checks.wide span{-webkit-line-clamp:unset}
.eng-checks.wide button{font-size:14px;padding:8px 8px 8px 22px}
.eng-checks.wide button::before{top:14px}
.eng-checks button.more{padding-left:20px;color:#2563EB;font-weight:600}
.eng-checks button.more::before{display:none}
.eng-checks button::before{content:"";position:absolute;left:8px;top:11px;width:6px;height:6px;border-radius:50%;background:#2563EB}
.eng-checks button.warn::before{background:#d97706}
.eng-checks button:active{background:#f0f3f6}
/* Stock thicknesses: one tap sets the depth */
.eng-chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:-6px}
.eng-chips::-webkit-scrollbar{display:none}
.eng-chips button{flex:none;min-width:34px;min-height:32px;padding:0 6px;border:1px solid #dce1e7;border-radius:8px;background:#fff;color:#3B4650;font:600 13px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer;transition:transform 160ms cubic-bezier(.23,1,.32,1)}
.eng-chips button:active{transform:scale(.97)}
.eng-chips button.on{background:#EAF0FF;border-color:#2563EB;color:#1d4ed8}
.eng-dialog select{height:44px;padding:0 10px;border:1px solid #cfd6df;border-radius:9px;background:#fff;font:16px -apple-system,BlinkMacSystemFont,sans-serif;color:#1F2A36}
/* Status toast: shows what an engineering tool did, or why it could not run */
.eng-toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:12px;max-width:min(440px,calc(100vw - 32px));padding:10px 16px;border:1px solid #e3e7eb;border-radius:12px;background:#fff;color:#1F2A36;font:500 14px/1.35 -apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 8px 24px #1f2a3614;pointer-events:none;animation:eng-toast-in 200ms cubic-bezier(.23,1,.32,1) both}
.eng-toast.warn{background:#FFFAEB;border-color:#F3DFA8;color:#7A4A06}
.eng-toast.leaving{animation:eng-toast-out 150ms cubic-bezier(.23,1,.32,1) both}
.eng-toast.sticky{pointer-events:auto;padding:6px 6px 6px 16px}
.eng-toast button{min-height:36px;padding:0 14px;border:0;border-radius:8px;background:#f0f3f6;color:#1F2A36;font:600 14px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer;transition:transform 160ms cubic-bezier(.23,1,.32,1)}
.eng-toast button:active{transform:scale(.97)}
/* First-run hint while the sheet is empty */
.eng-hint{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;max-width:min(460px,calc(100vw - 32px));color:#7b8794;font:500 14px -apple-system,BlinkMacSystemFont,sans-serif;text-align:center;pointer-events:none}
/* 3D preview: the laptop's model of the drawing, in a dark CAD-style panel at the top right, clear of the toasts and hints */
.eng-3d{position:fixed;right:16px;top:calc(72px + env(safe-area-inset-top,0px));z-index:20;width:min(46vw,640px);height:min(52vh,520px);display:flex;flex-direction:column;overflow:hidden;background:#0B0F17;border:1px solid #1F2937;border-radius:14px;box-shadow:0 18px 48px #0b0f1740;touch-action:none;animation:eng-rise 200ms cubic-bezier(.23,1,.32,1)}
.eng-3d header{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 6px 0 14px;background:#111723;border-bottom:1px solid #1F2937;color:#E5EAF0;font:500 12px -apple-system,BlinkMacSystemFont,sans-serif}
.eng-3d header strong{font-weight:700;color:#35C4E8;letter-spacing:.06em}
.eng-3d header span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#8B98A9;font-variant-numeric:tabular-nums}
.eng-3d header button{min-width:36px;min-height:32px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#E5EAF0;font:600 12px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer}
.eng-3d header button:active{background:#1F2937}
.eng-3d-view{flex:1;min-height:0}
.eng-3d-view canvas{display:block;width:100%;height:100%}
@media (max-width:760px){.eng-3d{left:16px;right:16px;top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:auto;height:42vh}}
@keyframes eng-toast-in{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes eng-toast-out{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,4px)}}
@keyframes eng-toast-fade{to{opacity:0}}
@media (prefers-reduced-motion:reduce){.eng-toast{animation:none}.eng-toast.leaving{animation:eng-toast-fade 150ms ease-out both}}
/* Depth dialog for Mark profile */
.eng-dialog-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(31,42,54,.17);padding:24px}
.eng-dialog{width:min(380px,100%);max-height:calc(100% - 24px);overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding:20px;background:#fff;border:1px solid #e8ebee;border-radius:14px;box-shadow:0 18px 60px #1f2a362b;font:14px -apple-system,BlinkMacSystemFont,sans-serif;color:#1F2A36;animation:eng-dialog-in 200ms cubic-bezier(.23,1,.32,1) both}
@keyframes eng-dialog-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.eng-dialog h2{margin:0;font:600 17px -apple-system,BlinkMacSystemFont,sans-serif}
.eng-dialog label{display:flex;flex-direction:column;gap:6px;font-weight:500;color:#3B4650}
.eng-dialog input{height:44px;padding:0 12px;border:1px solid #cfd6df;border-radius:9px;font:16px -apple-system,BlinkMacSystemFont,sans-serif}
.eng-dialog-actions{display:flex;justify-content:flex-end;gap:8px}
.eng-dialog-actions button{min-height:44px;padding:0 18px;border-radius:9px;border:1px solid #dce1e7;background:#fff;color:#3B4650;font:600 14px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer;transition:transform 160ms cubic-bezier(.23,1,.32,1)}
.eng-dialog-actions button:active{transform:scale(.97)}
.eng-dialog-actions .primary{background:#2563EB;border-color:#2563EB;color:#fff}
.eng-dialog-actions .primary:disabled{background:#a9bff2;border-color:#a9bff2;cursor:default}
.eng-dialog-actions .danger{margin-right:auto;color:#b42318;border-color:#f1d0cc}
.eng-row{display:flex;gap:10px}
.eng-row label{flex:1;min-width:0}
@media (prefers-reduced-motion:reduce){.eng-dialog{animation:none}}
/* Part feature dialog: Extrude / Revolve switch and a summary line */
.eng-seg{display:flex;gap:4px;padding:3px;border-radius:10px;background:#f0f3f6}
.eng-seg button{flex:1;min-height:38px;border:0;border-radius:8px;background:transparent;color:#3B4650;font:600 14px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer}
.eng-seg button.on{background:#fff;color:#1F2A36;box-shadow:0 1px 3px #1f2a3626}
.eng-note{margin:0;color:#5b6772;font-size:13px}
.eng-note.warn{color:#b45309}
/* Excalidraw's shape properties sit on the right, clear of the engineering sidebar */
.App-menu__left{position:fixed!important;top:72px;right:16px;left:auto!important;max-height:calc(100% - 96px);overflow-y:auto}
/* Engineering lines are always clean: no sloppiness or rounded edges to choose */
.App-menu__left fieldset:has(input[name="sloppiness"]),.App-menu__left fieldset:has(input[name="edges"]){display:none}
/* Top bar: keep the drawing tools; hide image, the More tools menu and the tool lock */
[title^="Insert image"],[title^="Keep selected tool"],.App-toolbar__extra-tools-trigger,.dropdown-menu-button{display:none!important}
</style>
</head>
<body>
<div id="root"></div>
<script>
// iPad Safari zooms the whole page on pinch unless told not to. The board handles pinch itself.
["gesturestart", "gesturechange", "gestureend"].forEach(function (type) {
  document.addEventListener(type, function (e) { e.preventDefault(); }, { passive: false });
});
</script>

<script>window.EXCALIDRAW_ASSET_PATH = "/dist/";</script>
<script src="/dist/app.js"></script>
</body>
</html>

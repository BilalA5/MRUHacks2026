<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sketch</title>
<link rel="stylesheet" href="/dist/app.css">
<style>
html,body,#root{height:100%;margin:0;overflow:hidden;touch-action:none;overscroll-behavior:none}
.board{position:fixed;inset:0}
/* Send sits above Excalidraw's help button, clear of its toolbar and menus */
.send-bar{position:absolute;bottom:calc(64px + env(safe-area-inset-bottom,0px));right:calc(16px + env(safe-area-inset-right,0px));z-index:10;display:flex;align-items:center;gap:10px}
.send-btn{min-height:44px;padding:0 20px;border:0;border-radius:12px;background:#2563EB;color:#fff;font:600 15px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer;box-shadow:0 4px 14px #2563eb33;transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 160ms ease}
.send-btn:active{transform:scale(.97)}
.send-btn:disabled{opacity:.6;cursor:default}
@media (hover:hover) and (pointer:fine){.send-btn:hover{background:#1D4ED8}}
.send-msg{background:#fff;border:1px solid #e3e7eb;border-radius:999px;padding:8px 14px;font:13px -apple-system,BlinkMacSystemFont,sans-serif;color:#3B4650;box-shadow:0 4px 14px #1f2a3614}
@media (prefers-reduced-motion:reduce){.send-btn{transition:none}}
.eng-tools{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:6px;padding:6px;max-width:calc(100vw - 32px);overflow-x:auto;scrollbar-width:none;background:#fff;border:1px solid #e3e7eb;border-radius:12px;box-shadow:0 8px 24px #1f2a3614}
.eng-tools button{min-height:36px;padding:0 12px;white-space:nowrap;border:0;border-radius:8px;background:transparent;color:#3B4650;font:600 13px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer;transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 160ms ease,color 160ms ease}
.eng-tools button:active{transform:scale(.97)}
.eng-tools button.on{background:#EAF0FF;color:#2563EB}
@media (hover:hover) and (pointer:fine){.eng-tools button:hover{background:#f0f3f6}}
</style>
</head>
<body>
<div id="root"></div>
<script>window.EXCALIDRAW_ASSET_PATH = "/dist/";</script>
<script src="/dist/app.js"></script>
</body>
</html>

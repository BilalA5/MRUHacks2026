<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBFBF7">
<title>Draft — Engineering Sketch</title>
<style>
:root{
  --paper:#FBFBF7;--line:#3B4650;--ink:#1F2A36;--accent:#2563EB;--error:#B42318;
  --edge:16px;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --safe-t:env(safe-area-inset-top,0px);--safe-r:env(safe-area-inset-right,0px);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-l:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--line);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
button,input,select{font-family:inherit}
/* iOS zooms the whole page when a field with text under 16px is focused */
input,select{font-size:16px}
#app{position:fixed;inset:0;overflow:hidden;background:var(--paper)}
#sheet{position:absolute;inset:20px;border:2px solid var(--line);pointer-events:none}
#drawing{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

.pill{position:absolute;z-index:4;display:flex;align-items:center;gap:7px;font-size:13px;color:#53606d;background:rgba(255,255,255,.92);border:1px solid #e5e7e8;border-radius:999px;padding:7px 12px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#2f9b69;flex:none}
#status{top:calc(16px + var(--safe-t));right:calc(16px + var(--safe-r))}
#hint{position:absolute;z-index:4;top:calc(16px + var(--safe-t));left:50%;transform:translateX(-50%);max-width:calc(100vw - 400px);min-width:200px;font-size:14px;line-height:1.3;color:#697580;text-align:center;white-space:normal;pointer-events:none;transition:opacity .2s ease}
#hint.hidden{opacity:0}

/* Toolbar: floats on the left, scrolls if the screen is short */
#toolbar{position:absolute;left:calc(var(--edge) + var(--safe-l));top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:4px;width:56px;padding:6px;max-height:calc(100% - 2*var(--edge) - var(--safe-t) - var(--safe-b));overflow:auto;scrollbar-width:none;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(59,70,80,.12);border-radius:12px;box-shadow:0 8px 28px rgba(31,42,54,.12),0 1px 3px rgba(31,42,54,.07)}
#toolbar::-webkit-scrollbar{display:none}
.tool{width:44px;height:44px;flex:none;border:0;border-radius:9px;background:transparent;color:#52606d;display:grid;place-items:center;cursor:pointer;position:relative;touch-action:manipulation;transition:transform 160ms var(--ease-out),background-color 160ms ease,color 160ms ease}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool:active{transform:scale(.97)}
.tool.selected{background:#EAF0FF;color:var(--accent)}
.tool.selected svg{stroke-width:2.2}
.tool:disabled{opacity:.35;cursor:default;transform:none}
.tool.send{background:var(--accent);color:#fff}
.tool.send:disabled{background:#8AA7EF;opacity:.7}
.separator{height:1px;background:#dfe3e7;margin:3px 4px;flex:none}
@media (hover:hover) and (pointer:fine){
  .tool:hover{background:#f0f3f6}
  .tool.selected:hover{background:#dfe8ff}
  .tool.send:hover{background:#1D4ED8}
  .tool[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:52px;top:50%;transform:translateY(-50%);padding:6px 9px;border-radius:6px;background:#263341;color:#fff;font-size:12px;white-space:nowrap;pointer-events:none}
}

/* Settings */
#settings{position:absolute;top:calc(56px + var(--safe-t));right:calc(16px + var(--safe-r));z-index:6}
#settingsBtn{width:44px;height:44px;border:1px solid #e1e5e8;background:rgba(255,255,255,.92);border-radius:10px;display:grid;place-items:center;color:#53606d;cursor:pointer;transition:transform 160ms var(--ease-out)}
#settingsBtn:active{transform:scale(.97)}
#settingsBtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
#settingsMenu{position:absolute;right:0;top:50px;width:200px;padding:6px;background:#fff;border:1px solid #e3e7eb;border-radius:12px;box-shadow:0 12px 32px #1f2a361c;transform-origin:top right;opacity:0;transform:scale(.97);pointer-events:none;transition:opacity 160ms ease,transform 160ms var(--ease-out)}
#settingsMenu.open{opacity:1;transform:none;pointer-events:auto}
.setting{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 10px;font-size:14px;gap:12px}
.setting input{width:20px;height:20px;accent-color:var(--accent)}

/* Title block: collapsed to a small tab; opens into an editable panel */
#titleBtn{position:absolute;right:calc(var(--edge) + var(--safe-r));bottom:calc(var(--edge) + var(--safe-b));z-index:5;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;background:rgba(255,255,255,.94);border:1px solid #d9dee3;border-radius:12px;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px #1f2a3614;transition:transform 160ms var(--ease-out),opacity 160ms ease}
#titleBtn:active{transform:scale(.97)}
#titleBtn.hidden{opacity:0;pointer-events:none}
#titleBtn .no{font-size:13px;font-weight:500;color:#65717c;font-variant-numeric:tabular-nums}
#titlePanel{position:absolute;right:calc(var(--edge) + var(--safe-r));bottom:calc(var(--edge) + var(--safe-b));z-index:6;width:min(300px,calc(100vw - 2*var(--edge)));max-height:min(60vh,380px);display:flex;flex-direction:column;background:#fff;border:1px solid #d9dee3;border-radius:12px;box-shadow:0 14px 40px #1f2a3626;transform-origin:bottom right;opacity:0;transform:scale(.97);pointer-events:none;transition:opacity 180ms ease,transform 180ms var(--ease-out)}
#titlePanel.open{opacity:1;transform:none;pointer-events:auto}
.tp-head{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 10px 0 14px;border-bottom:1px solid #eef1f4;font-size:14px;font-weight:600}
.tp-head button{min-height:40px;padding:0 12px;border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;border-radius:8px;cursor:pointer}
.tp-head button:active{transform:scale(.97)}
.tp-body{overflow:auto;padding:10px;touch-action:pan-y}
.field{display:grid;grid-template-columns:1fr 1.3fr 36px;gap:6px;align-items:center;margin-bottom:8px}
.field input{min-width:0;height:40px;border:1px solid #d6dde4;border-radius:8px;padding:0 9px;color:var(--ink);background:#fff}
.field input:focus{outline:2px solid #9bb7ff;outline-offset:1px}
.field .remove{width:36px;height:40px;border:0;background:transparent;color:#65717c;font-size:22px;line-height:1;border-radius:8px;cursor:pointer}
.field .remove:active{transform:scale(.97)}
.empty{font-size:13px;color:#7a8794;margin:4px 4px 10px}
.tp-foot{padding:8px 10px 10px;border-top:1px solid #eef1f4}
#addField{width:100%;min-height:44px;border:1px dashed #b9c3cd;background:transparent;border-radius:8px;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;transition:transform 160ms var(--ease-out)}
#addField:active{transform:scale(.99)}

/* Toasts and notices sit at the bottom or top, clear of the panels */
#toast{position:absolute;top:calc(110px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:8;background:#263341;color:#fff;padding:7px 12px;border-radius:7px;font-size:13px;white-space:nowrap;opacity:0;transition:opacity 120ms ease;pointer-events:none}
#toast.show{opacity:1}
#notice{position:absolute;left:50%;bottom:calc(var(--edge) + var(--safe-b));transform:translateX(-50%);z-index:8;display:none;align-items:center;gap:8px;max-width:min(380px,calc(100vw - 32px));padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #f0c6c1;box-shadow:0 5px 20px #1f2a3610;color:var(--error);font-size:13px}
#notice.visible{display:flex}
#notice button{min-height:36px;border:0;background:#fff0ee;color:var(--error);font-weight:650;padding:0 10px;border-radius:7px;cursor:pointer}
#sentBadge{position:absolute;left:50%;bottom:calc(var(--edge) + var(--safe-b));transform:translateX(-50%);z-index:8;background:#e9f7ef;color:#176b42;border:1px solid #bfe8d0;padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity 150ms ease;white-space:nowrap}
#sentBadge.show{opacity:1}

/* Dimension value sheet */
#dimSheet{position:absolute;left:50%;bottom:calc(var(--edge) + var(--safe-b));transform:translate(-50%,120%);width:min(480px,calc(100vw - 2*var(--edge)));background:#fff;border:1px solid #e4e8ec;border-radius:12px;box-shadow:0 14px 45px #1f2a3625;padding:16px;z-index:10;transition:transform 200ms var(--ease-out)}
#dimSheet.open{transform:translate(-50%,0)}
#dimSheet h2{font-size:15px;font-weight:650;margin:0 0 12px}
.dimrow{display:flex;align-items:center;gap:10px}
#dimValue{min-width:0;flex:1;height:44px;border:1px solid #cfd6df;border-radius:8px;padding:0 12px;color:var(--ink);outline-color:var(--accent)}
.unit{font-size:14px;color:#5e6a77}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.actions button,.dialog button{min-height:44px;padding:0 17px;border-radius:9px;border:1px solid #dce1e7;background:#fff;color:var(--line);font-weight:600;font-size:14px;cursor:pointer;transition:transform 160ms var(--ease-out)}
.actions button:active,.dialog button:active{transform:scale(.97)}
.actions .primary,.dialog .primary{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Confirm dialog */
#overlay{position:absolute;inset:0;background:rgba(31,42,54,.17);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
#overlay.open{display:flex}
.dialog{width:min(340px,100%);background:#fff;border:1px solid #e8ebee;border-radius:12px;padding:22px;box-shadow:0 18px 60px #1f2a362b}
.dialog h2{font-size:17px;margin:0 0 8px;color:var(--ink)}
.dialog p{font-size:14px;line-height:1.45;margin:0;color:#65717c}
.dialog .actions{margin-top:20px}

@keyframes spin{to{transform:rotate(360deg)}}

/* Phones and narrow windows: smaller controls, nothing overlaps */
@media(max-width:600px){
  #sheet{inset:12px}
  #toolbar{left:calc(10px + var(--safe-l));width:50px;padding:4px}
  .tool{width:42px;height:42px}
  #hint{top:calc(56px + var(--safe-t));max-width:calc(100vw - 150px);font-size:13px}
  #settings{top:calc(56px + var(--safe-t))}
  #status{font-size:12px;padding:6px 10px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app" aria-label="Engineering drawing canvas">
  <div id="sheet" aria-hidden="true"></div>
  <canvas id="drawing" aria-label="Drawing sheet. Draw with Apple Pencil."></canvas>
  <div id="hint" role="note">Draw your part. Tap Send when it's ready.</div>
  <div id="status" class="pill"><span class="dot" id="statusDot"></span><span id="statusText">Checking laptop…</span></div>

  <nav id="toolbar" role="toolbar" aria-label="Drawing tools">
    <button class="tool mode selected" data-tool="pen" data-tip="Pen" aria-label="Pen" aria-pressed="true">
      <svg viewBox="0 0 24 24"><path d="m4 20 4.5-1 10.8-10.8a2.1 2.1 0 0 0-3-3L5.5 16 4 20Z"/><path d="m14.8 6.2 3 3"/></svg>
    </button>
    <button class="tool mode" data-tool="eraser" data-tip="Eraser" aria-label="Eraser" aria-pressed="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>
    </button>
    <button class="tool mode" data-tool="line" data-tip="Line" aria-label="Line" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M5 19 19 5"/><circle cx="5" cy="19" r="1.6"/><circle cx="19" cy="5" r="1.6"/></svg>
    </button>
    <button class="tool mode" data-tool="rect" data-tip="Rectangle" aria-label="Rectangle" aria-pressed="false">
      <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5"/></svg>
    </button>
    <button class="tool mode" data-tool="circle" data-tip="Circle" aria-label="Circle" aria-pressed="false">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
    </button>
    <button class="tool mode" data-tool="ruler" data-tip="Ruler" aria-label="Ruler" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M3.5 16.5 16.5 3.5l4 4L7.5 20.5z"/><path d="m7 13 2 2m1-5 2 2m1-5 2 2"/></svg>
    </button>
    <button class="tool mode" data-tool="dimension" data-tip="Dimension" aria-label="Dimension" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M5 19 19 5"/><path d="m5 13 0 6 6 0M13 5h6v6"/><path d="M8 16 16 8"/></svg>
    </button>
    <div class="separator" role="separator"></div>
    <button class="tool" data-tool="undo" data-tip="Undo" aria-label="Undo" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a6 6 0 0 1 0 12h-2"/></svg>
    </button>
    <button class="tool" data-tool="redo" data-tip="Redo" aria-label="Redo" disabled>
      <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9h-9a6 6 0 0 0 0 12h2"/></svg>
    </button>
    <button class="tool" data-tool="clear" data-tip="Clear" aria-label="Clear sheet">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
    </button>
    <div class="separator" role="separator"></div>
    <button class="tool send" data-tool="send" data-tip="Send" aria-label="Send drawing to laptop">
      <svg viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
    </button>
  </nav>

  <div id="settings">
    <button id="settingsBtn" aria-label="Canvas settings" aria-expanded="false" aria-controls="settingsMenu">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4L7.3 15a8 8 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.1a8 8 0 0 1-.1 2Z"/></svg>
    </button>
    <div id="settingsMenu">
      <label class="setting">Show grid <input id="gridToggle" type="checkbox" checked></label>
      <label class="setting">Snap shapes <input id="snapToggle" type="checkbox" checked></label>
    </div>
  </div>

  <button id="titleBtn" aria-expanded="false" aria-controls="titlePanel">
    <span>Title</span><span class="no" id="drawingNo">DWG-001</span>
  </button>
  <section id="titlePanel" aria-label="Title block">
    <div class="tp-head"><span>Title block</span><button id="titleDone">Done</button></div>
    <div class="tp-body" id="fieldList"></div>
    <div class="tp-foot"><button id="addField">+ Add field</button></div>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="notice" role="alert"><span>Could not reach laptop. Check Wi-Fi and try again.</span><button id="retry">Retry</button></div>
  <div id="sentBadge" role="status" aria-live="polite">Sent to laptop</div>
  <section id="dimSheet" role="dialog" aria-modal="true" aria-labelledby="dimTitle">
    <h2 id="dimTitle">Dimension value</h2>
    <div class="dimrow"><input id="dimValue" type="number" min="0" step="any" aria-label="Dimension value in millimeters"><span class="unit">mm</span></div>
    <div class="actions"><button id="dimCancel">Cancel</button><button id="dimAdd" class="primary">Add</button></div>
  </section>
  <div id="overlay" role="presentation">
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="clearTitle">
      <h2 id="clearTitle">Clear the sheet?</h2>
      <p>This removes all strokes and dimensions. You can undo it.</p>
      <div class="actions"><button id="clearCancel">Cancel</button><button id="clearConfirm" class="primary">Clear</button></div>
    </div>
  </div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('drawing');
  let ctx = canvas.getContext('2d');
  const app = $('app'), hint = $('hint'), toolbar = $('toolbar');
  const dimSheet = $('dimSheet'), dimValue = $('dimValue'), overlay = $('overlay');
  const notice = $('notice'), sentBadge = $('sentBadge'), toastEl = $('toast');
  const titleBtn = $('titleBtn'), titlePanel = $('titlePanel'), fieldList = $('fieldList');
  const settingsBtn = $('settingsBtn'), settingsMenu = $('settingsMenu');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ERASE_R = 14;                 // eraser circle radius, CSS px

  let dpr = 1;
  let strokes = [], dimensions = [];  // strokes: {points:[{x,y,p}], shape?}; dimensions: {a,b,value}
  let undoStack = [], redoStack = [];
  let tool = 'pen', gesture = null, pointerPos = null, ruler = null;
  let dimFirst = null, dimPreview = null;
  let grid = true, snap = true, connected = false, sending = false;
  let drawingNo = 1, fields = [], titleOpen = false, toastTimer, sentTimer;

  // ---------- geometry helpers ----------
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  function distToSeg(p, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy;
    if (!l2) return dist(p, a);
    const t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / l2));
    return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
  }
  const ring = (cx, cy, r) => Array.from({ length: 65 }, (_, i) => ({
    x: cx + r * Math.cos(i / 64 * Math.PI * 2), y: cy + r * Math.sin(i / 64 * Math.PI * 2), p: .5
  }));
  const point = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, p: e.pressure || .5 }; };
  const isInk = e => e.pointerType === 'pen' || e.pointerType === 'mouse';   // fingers never draw
  const modalOpen = () => dimSheet.classList.contains('open') || overlay.classList.contains('open');

  // ---------- shape rules ----------
  // Straight line (pen strokes, Snap on). A stroke becomes a line only if ALL hold:
  //  1. at least 5 samples and start-to-end distance of at least 40 px
  //  2. every sample lies within 5 px of the start-to-end segment
  // Then the end is moved onto the nearest 45-degree angle if it is within 3 degrees of one; otherwise the end stays where drawn.
  function straightLine(points) {
    const a = points[0], b = points[points.length - 1];
    const len = dist(a, b);
    if (points.length < 5 || len < 40) return null;
    let maxDev = 0;
    for (const q of points) maxDev = Math.max(maxDev, distToSeg(q, a, b));
    if (maxDev > 5) return null;
    let ang = Math.atan2(b.y - a.y, b.x - a.x);
    const step = Math.PI / 4, near = Math.round(ang / step) * step;
    if (Math.abs(ang - near) < 3 * Math.PI / 180) ang = near;
    const end = { x: a.x + Math.cos(ang) * len, y: a.y + Math.sin(ang) * len, p: b.p };
    return { points: [a, end], shape: { kind: 'line', a: { x: a.x, y: a.y }, b: { x: end.x, y: end.y } } };
  }
  // Closed circle (pen strokes, Snap on). A stroke becomes a circle only if ALL hold:
  //  1. its bounding box is at least 24 px on each side and no more than 1.3:1 in shape
  //  2. the end is within 25% of the larger side of the start point (the loop closes)
  //  3. every sample is within 15% of the average radius from the box centre
  function closedCircle(points) {
    const xs = points.map(p => p.x), ys = points.map(p => p.y);
    const w = Math.max(...xs) - Math.min(...xs), h = Math.max(...ys) - Math.min(...ys);
    if (w < 24 || h < 24 || Math.max(w, h) / Math.min(w, h) > 1.3) return null;
    if (dist(points[0], points[points.length - 1]) > .25 * Math.max(w, h)) return null;
    const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2, r = (w + h) / 4;
    for (const q of points) if (Math.abs(dist(q, { x: cx, y: cy }) - r) > .15 * r) return null;
    return { points: ring(cx, cy, r), shape: { kind: 'circle', cx, cy, r } };
  }
  function finishPen(points) {
    if (points.length < 2) return { points };
    if (snap) {
      const line = straightLine(points);
      if (line) { showToast('Line'); return line; }
      const circle = closedCircle(points);
      if (circle) { showToast('Circle'); return circle; }
    }
    return { points };
  }
  // Shape tools: drag from a start point to a current point.
  function shapeFor(kind, a, b) {
    if (kind === 'line') {
      if (dist(a, b) < 4) return null;
      return { points: [a, b], shape: { kind: 'line', a: { x: a.x, y: a.y }, b: { x: b.x, y: b.y } } };
    }
    if (kind === 'rect') {
      const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y), w = Math.abs(b.x - a.x), h = Math.abs(b.y - a.y);
      if (w < 4 || h < 4) return null;
      const pts = [{ x, y }, { x: x + w, y }, { x: x + w, y: y + h }, { x, y: y + h }, { x, y }].map(q => ({ ...q, p: .5 }));
      return { points: pts, shape: { kind: 'rect', x, y, w, h } };
    }
    if (kind === 'circle') {
      const r = dist(a, b);
      if (r < 4) return null;
      return { points: ring(a.x, a.y, r), shape: { kind: 'circle', cx: a.x, cy: a.y, r } };
    }
    return null;
  }

  // ---------- history (snapshot based) ----------
  const snapshot = () => JSON.parse(JSON.stringify({ strokes, dimensions }));
  function change(fn) {
    const pre = snapshot();
    fn();
    undoStack.push(pre); if (undoStack.length > 100) undoStack.shift();
    redoStack = [];
    updateButtons(); render();
  }
  function restore(s) { strokes = s.strokes; dimensions = s.dimensions; updateButtons(); render(); }
  function undo() { if (!undoStack.length) return; redoStack.push(snapshot()); restore(undoStack.pop()); }
  function redo() { if (!redoStack.length) return; undoStack.push(snapshot()); restore(redoStack.pop()); }
  function updateButtons() {
    toolbar.querySelector('[data-tool="undo"]').disabled = !undoStack.length;
    toolbar.querySelector('[data-tool="redo"]').disabled = !redoStack.length;
    hint.classList.toggle('hidden', strokes.length + dimensions.length > 0);
  }

  // ---------- drawing ----------
  function resize() {
    const r = app.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
    canvas.style.width = r.width + 'px'; canvas.style.height = r.height + 'px';
    render();
  }
  function label(text, x, y) {
    ctx.font = '13px -apple-system,BlinkMacSystemFont,sans-serif';
    const w = ctx.measureText(text).width + 12;
    ctx.fillStyle = '#FBFBF7'; ctx.fillRect(x - w / 2, y - 10, w, 20);
    ctx.fillStyle = '#2563EB'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, x, y);
  }
  function drawPolyline(pts, color = '#1F2A36', fixed = null) {
    if (!pts || !pts.length) return;
    ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (pts.length === 1) { ctx.beginPath(); ctx.arc(pts[0].x, pts[0].y, 1, 0, Math.PI * 2); ctx.fill(); }
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.lineWidth = fixed || ((a.p && b.p) ? Math.max(1, Math.min(3, (a.p + b.p) * 2)) : 2);
      ctx.stroke();
    }
    ctx.restore();
  }
  function drawDimension(d) {
    const dx = d.b.x - d.a.x, dy = d.b.y - d.a.y, len = Math.hypot(dx, dy) || 1;
    const ox = -dy / len * 18, oy = dx / len * 18;
    const a = { x: d.a.x + ox, y: d.a.y + oy }, b = { x: d.b.x + ox, y: d.b.y + oy };
    ctx.save(); ctx.strokeStyle = '#2563EB'; ctx.fillStyle = '#2563EB'; ctx.lineWidth = 1.35;
    ctx.beginPath(); ctx.moveTo(d.a.x, d.a.y); ctx.lineTo(a.x, a.y); ctx.moveTo(d.b.x, d.b.y); ctx.lineTo(b.x, b.y); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    const arrow = (x, y, ang) => { const L = 7; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - L * Math.cos(ang - .42), y - L * Math.sin(ang - .42)); ctx.moveTo(x, y); ctx.lineTo(x - L * Math.cos(ang + .42), y - L * Math.sin(ang + .42)); ctx.stroke(); };
    arrow(a.x, a.y, Math.atan2(b.y - a.y, b.x - a.x)); arrow(b.x, b.y, Math.atan2(a.y - b.y, a.x - b.x));
    label(String(d.value != null ? d.value : Math.round(len)) + ' mm', (a.x + b.x) / 2, (a.y + b.y) / 2);
    ctx.restore();
  }
  function drawRuler(a, b) {
    ctx.save(); ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 1.3; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.setLineDash([]);
    label(Math.round(dist(a, b)) + ' mm', (a.x + b.x) / 2, (a.y + b.y) / 2 - 16);
    ctx.restore();
  }
  function drawContent(transient) {
    for (const s of strokes) drawPolyline(s.points);
    dimensions.forEach(drawDimension);
    if (!transient) return;
    if (gesture) {
      if (gesture.tool === 'pen') drawPolyline(gesture.points);
      else if (['line', 'rect', 'circle'].includes(gesture.tool)) { const s = shapeFor(gesture.tool, gesture.start, gesture.cur); if (s) drawPolyline(s.points); }
      else if (gesture.tool === 'ruler') drawRuler(gesture.start, gesture.cur);
    }
    if (ruler) drawRuler(ruler.a, ruler.b);
    if (dimFirst) { ctx.save(); ctx.strokeStyle = '#2563EB'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(dimFirst.x - 8, dimFirst.y); ctx.lineTo(dimFirst.x + 8, dimFirst.y); ctx.moveTo(dimFirst.x, dimFirst.y - 8); ctx.lineTo(dimFirst.x, dimFirst.y + 8); ctx.stroke(); ctx.restore(); }
    if (dimPreview) drawDimension({ a: dimFirst, b: dimPreview });
  }
  function render() {
    const w = canvas.width / dpr, h = canvas.height / dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
    if (grid) {
      ctx.save(); ctx.strokeStyle = '#E3E6EA'; ctx.lineWidth = 1; ctx.beginPath();
      for (let x = .5; x < w; x += 20) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
      for (let y = .5; y < h; y += 20) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
      ctx.stroke(); ctx.restore();
    }
    drawContent(true);
    if (tool === 'eraser' && pointerPos) {
      ctx.save(); ctx.beginPath(); ctx.arc(pointerPos.x, pointerPos.y, ERASE_R, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(31,42,54,.08)'; ctx.fill(); ctx.strokeStyle = '#1F2A36'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore();
    }
  }
  // Strokes and dimensions only, on white, with no grid, title block or previews. This is what the model sees.
  function exportPng() {
    const off = document.createElement('canvas'); off.width = canvas.width; off.height = canvas.height;
    const prev = ctx; ctx = off.getContext('2d');
    try {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);
      for (const s of strokes) drawPolyline(s.points);
      dimensions.forEach(drawDimension);
    } finally { ctx = prev; }
    return off.toDataURL('image/png');
  }

  // ---------- eraser: circular brush, removes every stroke or dimension it touches ----------
  function strokeHit(s, p) {
    const pts = s.points;
    if (pts.length === 1) return dist(p, pts[0]) <= ERASE_R;
    for (let i = 1; i < pts.length; i++) if (distToSeg(p, pts[i - 1], pts[i]) <= ERASE_R) return true;
    return false;
  }
  function eraseAt(p) {
    const before = strokes.length + dimensions.length;
    strokes = strokes.filter(s => !strokeHit(s, p));
    dimensions = dimensions.filter(d => distToSeg(p, d.a, d.b) > ERASE_R);
    if (strokes.length + dimensions.length !== before) gesture.changed = true;
  }

  // ---------- tools and toast ----------
  function showToast(text) {
    toastEl.textContent = text; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 700);
  }
  function setTool(next) {
    if (['undo', 'redo', 'clear', 'send'].includes(next)) { act(next); return; }
    tool = next; gesture = null; dimFirst = null; dimPreview = null; ruler = null; pointerPos = null;
    toolbar.querySelectorAll('.mode').forEach(b => {
      const on = b.dataset.tool === tool;
      b.classList.toggle('selected', on); b.setAttribute('aria-pressed', String(on));
    });
    render();
  }

  canvas.addEventListener('pointerdown', e => {
    if (!isInk(e) || modalOpen()) return;
    e.preventDefault(); canvas.setPointerCapture(e.pointerId);
    settingsMenu.classList.remove('open'); settingsBtn.setAttribute('aria-expanded', 'false');
    const p = point(e); pointerPos = p; ruler = null;
    if (tool === 'dimension') {
      if (!dimFirst) { dimFirst = p; showToast('Choose second point'); }
      else { dimPreview = p; openDimension(p); }
      render(); return;
    }
    if (tool === 'eraser') { gesture = { tool, pre: snapshot(), changed: false }; eraseAt(p); render(); return; }
    gesture = { tool, start: p, cur: p, points: [p] };
    render();
  });
  canvas.addEventListener('pointermove', e => {
    if (!isInk(e)) return;
    const p = point(e); pointerPos = p;
    if (gesture) {
      e.preventDefault();
      if (gesture.tool === 'eraser') eraseAt(p);
      else if (gesture.tool === 'pen') gesture.points.push(p);
      else gesture.cur = p;
      render();
    } else if (dimFirst && tool === 'dimension') { dimPreview = p; render(); }
    else if (tool === 'eraser') render();
  });
  function endGesture() {
    if (!gesture) return;
    const g = gesture; gesture = null; pointerPos = null;
    if (g.tool === 'pen') {
      const s = finishPen(g.points);
      change(() => strokes.push(s));
    } else if (['line', 'rect', 'circle'].includes(g.tool)) {
      const s = shapeFor(g.tool, g.start, g.cur);
      if (s) change(() => strokes.push(s));
    } else if (g.tool === 'ruler') {
      if (dist(g.start, g.cur) >= 4) ruler = { a: g.start, b: g.cur };
    } else if (g.tool === 'eraser' && g.changed) {
      undoStack.push(g.pre); if (undoStack.length > 100) undoStack.shift();
      redoStack = []; updateButtons();
    }
    render();
  }
  canvas.addEventListener('pointerup', endGesture);
  canvas.addEventListener('pointercancel', endGesture);
  canvas.addEventListener('pointerleave', () => { if (!gesture) { pointerPos = null; render(); } });

  // ---------- dimension value sheet ----------
  function openDimension(p) {
    dimSheet.classList.add('open');
    dimValue.value = (Math.round(dist(p, dimFirst) * 10) / 10).toString();
    setTimeout(() => { dimValue.focus(); dimValue.select(); }, reduced ? 0 : 210);
  }
  function closeDimension() { dimSheet.classList.remove('open'); dimFirst = null; dimPreview = null; render(); }
  $('dimCancel').onclick = closeDimension;
  $('dimAdd').onclick = () => {
    const v = parseFloat(dimValue.value);
    if (!Number.isFinite(v) || v < 0) { dimValue.focus(); return; }
    const d = { a: dimFirst, b: dimPreview, value: v };
    closeDimension();
    change(() => dimensions.push(d));
  };

  // ---------- actions ----------
  function act(which) {
    if (which === 'undo') undo();
    else if (which === 'redo') redo();
    else if (which === 'clear') { overlay.classList.add('open'); $('clearCancel').focus(); }
    else if (which === 'send') send();
  }
  $('clearCancel').onclick = () => overlay.classList.remove('open');
  $('clearConfirm').onclick = () => {
    overlay.classList.remove('open');
    if (!strokes.length && !dimensions.length) return;
    change(() => { strokes = []; dimensions = []; });
  };
  toolbar.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));

  // ---------- settings and title block ----------
  settingsBtn.onclick = () => {
    const open = settingsMenu.classList.toggle('open');
    settingsBtn.setAttribute('aria-expanded', String(open));
  };
  $('gridToggle').onchange = e => { grid = e.target.checked; render(); };
  $('snapToggle').onchange = e => { snap = e.target.checked; };

  function setTitleOpen(open) {
    titleOpen = open;
    titlePanel.classList.toggle('open', open);
    titleBtn.classList.toggle('hidden', open);
    titleBtn.setAttribute('aria-expanded', String(open));
    if (open) (fieldList.querySelector('input') || $('addField')).focus({ preventScroll: true });
  }
  titleBtn.onclick = () => setTitleOpen(true);
  $('titleDone').onclick = () => setTitleOpen(false);
  $('addField').onclick = () => {
    fields.push({ label: '', value: '' }); saveFields(); renderFields();
    const inputs = fieldList.querySelectorAll('.field input');
    if (inputs.length) inputs[inputs.length - 2].focus();
  };
  function loadFields() { try { fields = JSON.parse(localStorage.getItem('draft-title-fields') || '[]'); } catch (err) { fields = []; } }
  function saveFields() { try { localStorage.setItem('draft-title-fields', JSON.stringify(fields)); } catch (err) { /* private mode: keep in memory */ } }
  function renderFields() {
    fieldList.textContent = '';
    if (!fields.length) {
      const em = document.createElement('p'); em.className = 'empty'; em.textContent = 'No fields yet. Add one below.';
      fieldList.appendChild(em); return;
    }
    fields.forEach((f, i) => {
      const row = document.createElement('div'); row.className = 'field';
      const l = document.createElement('input'); l.placeholder = 'Label'; l.value = f.label; l.setAttribute('aria-label', 'Field label');
      const v = document.createElement('input'); v.placeholder = 'Value'; v.value = f.value; v.setAttribute('aria-label', 'Field value');
      const x = document.createElement('button'); x.className = 'remove'; x.textContent = '×'; x.setAttribute('aria-label', 'Remove field');
      l.oninput = () => { f.label = l.value; saveFields(); };
      v.oninput = () => { f.value = v.value; saveFields(); };
      x.onclick = () => { fields.splice(i, 1); saveFields(); renderFields(); };
      row.append(l, v, x); fieldList.appendChild(row);
    });
  }

  // ---------- laptop connection and send ----------
  function updateConnection() {
    $('statusDot').style.background = connected ? '#2f9b69' : '#B42318';
    $('statusText').textContent = connected ? 'Laptop connected' : 'Laptop disconnected';
    toolbar.querySelector('[data-tool="send"]').disabled = !connected || sending;
  }
  async function checkConnection() {
    try { const r = await fetch('/api/health', { cache: 'no-store' }); connected = r.ok; }
    catch (err) { connected = false; }
    updateConnection();
    return connected;
  }
  const SEND_ICON = '<svg viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>';
  const drawingLabel = () => 'DWG-' + String(drawingNo).padStart(3, '0');
  async function send() {
    if (sending) return;
    if (!strokes.length && !dimensions.length) { showToast('Draw something first'); return; }
    if (!connected) { showToast('Connect to the laptop to send.'); return; }
    sending = true;
    const btn = toolbar.querySelector('[data-tool="send"]');
    btn.innerHTML = '<svg viewBox="0 0 24 24" style="animation:spin 1s linear infinite"><circle cx="12" cy="12" r="8" stroke-dasharray="32 18"/></svg>';
    btn.setAttribute('aria-label', 'Sending…');
    notice.classList.remove('visible'); sentBadge.classList.remove('show'); updateConnection();
    const payload = {
      png: exportPng(),
      strokes: [...strokes, ...dimensions.map(d => ({ kind: 'dim', a: d.a, b: d.b, value: d.value }))],
      meta: {
        drawingNo: drawingLabel(),
        date: new Date().toISOString().slice(0, 10),
        fields: fields.filter(f => f.label.trim() || f.value.trim())
      }
    };
    try {
      const r = await fetch('/api/sketch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      drawingNo++; $('drawingNo').textContent = drawingLabel();
      sentBadge.classList.add('show'); clearTimeout(sentTimer);
      sentTimer = setTimeout(() => sentBadge.classList.remove('show'), 2000);
    } catch (err) {
      notice.classList.add('visible');
      await checkConnection();
    } finally {
      sending = false; btn.innerHTML = SEND_ICON; btn.setAttribute('aria-label', 'Send drawing to laptop'); updateConnection();
    }
  }
  $('retry').onclick = async () => { if (await checkConnection()) send(); };

  // ---------- no pinch or double-tap zoom ----------
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

  // ---------- keyboard ----------
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      overlay.classList.remove('open'); closeDimension();
      settingsMenu.classList.remove('open'); setTitleOpen(false);
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); act(e.shiftKey ? 'redo' : 'undo'); }
  });

  // ---------- start ----------
  window.addEventListener('resize', resize);
  loadFields(); renderFields(); resize(); updateButtons(); updateConnection();
  checkConnection(); setInterval(checkConnection, 5000);
})();
</script>
</body>
</html>
